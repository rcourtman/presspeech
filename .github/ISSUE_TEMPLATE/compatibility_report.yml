name: Target-app compatibility report
description: Share privacy-safe repeated paste and focus-safety results for one app.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing one target app. Run the short
        [compatibility protocol](https://rcourtman.github.io/presspeech/app-compatibility.html)
        before filling this in. Its optional local worksheet prepares the eight
        outcome counts below without writing selections to browser storage or
        sending them.
        Passing reports are useful too. [Browse existing
        compatibility reports](https://github.com/rcourtman/presspeech/issues?q=is%3Aissue%20in%3Atitle%20%22%5BCompatibility%5D%3A%22)
        first. When its platform, app version, and generic field type match
        yours, comment there with the worksheet block, Presspeech and OS
        versions, generic hardware if useful, and relevant conditions instead
        of opening a duplicate. Add the observation even when its outcome
        differs. Matching threads group reports; they do not make results from
        different Presspeech or OS versions or conditions directly comparable.
        Do not pool their counts into a general paste-success rate.

        For a new report, put the platform, public app name/version, and field
        type after the fixed `[Compatibility]:` title prefix. Include no
        document, tab, account, server, form, or window name.

        Issues are public. Report counts and classifications only. Never include
        dictated or recognized text, audio, clipboard contents, dictionary or
        shortcut contents, document/window titles, private paths, credentials,
        or screenshots containing user data.

        Never run this protocol at a command shell or in a field where pasted
        text can submit, send, or execute. Use only blank disposable fields.
  - type: input
    id: target-app
    attributes:
      label: Target app and version
      description: Name the app and exact version, but not a document, tab, account, server, or window.
      placeholder: e.g. Visual Studio Code 1.x
    validations:
      required: true
  - type: dropdown
    id: target-class
    attributes:
      label: Target class
      options:
        - Native desktop app
        - Browser page or web editor
        - Electron/Chromium desktop app
        - Terminal-based non-executing editor
        - Remote desktop or virtual machine
        - Elevated Windows app
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: field-type
    attributes:
      label: Target field type
      description: Choose only the generic control type; do not name a document, tab, account, server, form, or window.
      options:
        - Single-line plain-text field
        - Multi-line plain-text editor
        - Rich-text or contenteditable editor
        - Terminal-based non-executing editor
        - Other or unknown
    validations:
      required: true
  - type: input
    id: presspeech-version
    attributes:
      label: Presspeech version
      description: Copy Diagnostics includes this value.
      placeholder: Copy the exact x.y.z value from Diagnostics.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating-system version
      placeholder: e.g. macOS 26.4.1 or Windows 11 24H2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware (optional)
      description: On macOS, give the Mac model/chip. On Windows, give the CPU and optional GPU; omit serial numbers and device names.
      placeholder: e.g. MacBook Air M2 or Ryzen 7 7700 with RTX 4070
  - type: dropdown
    id: restore-state
    attributes:
      label: Clipboard preservation during the steady-focus check
      description: >-
        On macOS 0.3.8 or later, leave Keep Previous Clipboard for Manual
        Restore off. Update legacy 0.3.7 before running this baseline. Windows
        does not offer either option.
      options:
        - Off on macOS — required baseline
        - Not applicable on Windows
        - On or unknown — results are not a comparable baseline
    validations:
      required: true
  - type: textarea
    id: outcome-counts
    attributes:
      label: Eight-check outcome counts
      description: |
        Paste the block from the protocol's local worksheet, including its eight
        counts and Overall result, or enter the same values manually. The first
        four counts must total five and the final four must total three. Use
        counts and the fixed classification only; do not quote any transcript
        or clipboard content. A completed focus-change attempt with no insertion
        but missing notice or incomplete recovery is a failed recovery, not an
        unrun attempt. On Windows 0.1.13, count a safe focus-change Copy only
        after explicitly using Delivery Recovery and confirming the scratch
        paste; its notice alone does not mean the clipboard contains the
        transcript. After an incorrect or unsafe steady-focus result, stop,
        mark every unrun steady-focus and focus-change slot Not completed, and
        explain why under Relevant conditions. Do not repeat a safety failure
        just to fill the worksheet. If a focus-change attempt inserts into any
        field or recovery fails, stop and mark every later unrun focus-change
        slot Not completed; keep the completed attempt under its actual outcome.
        If completed checks followed either required stop or a Not completed
        slot, preserve the actual observations but do not submit them as a
        comparable eight-check report; follow the support guide for another
        suitable route. In an older six-count draft,
        a nonzero Other or not completed count is ambiguous; do not relabel it
        as a comparable new count. Retest safely if possible.
      placeholder: |
        Five steady-focus results
        Pasted once: 5
        Recovered safely: 0
        Incorrect or unsafe: 0
        Not completed: 0

        Three focus-change results
        Copied for manual paste without inserting anywhere: 3
        Inserted into any field: 0
        No insertion, but recovery failed: 0
        Not completed: 0

        Overall result: All five steady-focus attempts pasted once; all three focus-change attempts recovered safely
    validations:
      required: true
  - type: dropdown
    id: overall-result
    attributes:
      label: Overall result
      description: Focus-change recovery is expected. Select the recovery option only when it happened during a steady-focus attempt; choose the most severe applicable result.
      options:
        - All five steady-focus attempts pasted once; all three focus-change attempts recovered safely
        - Manual-paste recovery occurred during steady focus; no incorrect or unsafe result occurred
        - An incorrect or unsafe result occurred
        - Testing could not be completed
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Relevant conditions
      description: Note trigger mode, suffix, clipboard manager/history, assistive technology, or a minimal repro. Include the active keyboard layout/input source only when it differs from your usual layout or helps explain the result; use its public name and never include typed text. Separately count known clipboard-change interruptions excluded from completed attempts; do not exclude unexplained failures. Omit private document, account, server, and window names.
      placeholder: e.g. Dvorak input source; hold mode; plain-text editor field; append-space suffix; no clipboard manager
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics (optional)
      description: In Presspeech, choose Copy Diagnostics and review the result before pasting. It excludes transcript, audio, dictionary contents, exact microphone names, raw error details, and raw log lines.
      render: shell
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Public-report confirmation
      options:
        - label: I used only blank disposable fields and harmless test phrases.
          required: true
        - label: My four steady-focus outcome counts total five and my four focus-change outcome counts total three.
          required: true
        - label: I removed all dictated/recognized text, clipboard contents, private names, titles, paths, credentials, and sensitive screenshots from this report.
          required: true
        - label: I understand this report describes only the versions, field type, and conditions above, not universal app support.
          required: true
