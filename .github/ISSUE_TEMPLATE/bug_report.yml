name: Bug report
description: Report a Presspeech problem on macOS or Windows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Presspeech. Search existing issues first,
        then include the details below for the affected computer.

        Issues are public. Do not include dictated text, audio, dictionary or
        shortcut contents, credentials, or other private data. **Copy
        Diagnostics** in the Presspeech menu creates a privacy-safe summary.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence. Use harmless test text and do not paste the transcript into this public report.
      placeholder: |
        1. Open ...
        2. Hold ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Choose the closest part of the dictation loop.
      options:
        - Setup or install
        - Recording or hotkey
        - Recognition or text processing
        - Automatic paste or clipboard recovery
        - Update
        - App controls or accessibility
        - Other
    validations:
      required: true
  - type: input
    id: target-context
    attributes:
      label: Target app and context
      description: |
        For a delivery problem, include the target app and version and say
        whether it is native, browser-based, Electron/Chromium, a terminal,
        remote desktop, or elevated on Windows. Do not include a document,
        tab, account, server, or window title. Leave blank for other problems.
      placeholder: e.g. VS Code 1.x, Electron
  - type: dropdown
    id: delivery-result
    attributes:
      label: Text-delivery result
      description: What happened after transcription? Do not include the actual transcript or clipboard contents.
      options:
        - Not a text-delivery problem
        - Expected transcript pasted once
        - Transcript copied and manual-paste recovery shown
        - Transcript copied without a recovery notice
        - Previous or unrelated clipboard content pasted
        - Transcript went to the wrong window or field
        - Transcript was duplicated, incomplete, or changed
        - Transcript was not available on the clipboard
        - Other
    validations:
      required: true
  - type: textarea
    id: delivery-conditions
    attributes:
      label: Delivery conditions and frequency
      description: |
        For a delivery problem, say whether focus stayed in the same field,
        moved within the same app, or moved to another app; whether **Restore
        clipboard after paste** was on; whether manual paste recovered the
        expected complete text; and how many attempts failed out of how many.
        Do not quote any transcript, clipboard content, document, or window
        title. Leave blank for other problems.
      placeholder: e.g. Same field; clipboard restore off; manual paste recovered the complete test phrase; 4 of 5 attempts
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Presspeech version
      description: Copy Diagnostics includes this value.
      placeholder: Copy the exact version shown in Diagnostics.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: e.g. macOS 26.4.1 or Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: |
        On macOS, include the Mac model and chip. On Windows, include the CPU
        and, when present, the GPU and driver version.
      placeholder: e.g. Mac mini, M2 or Ryzen 7 7700, RTX 4070, driver 580.88
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Setup and readiness
      description: |
        macOS: say whether the model, Microphone, Accessibility, Input
        Monitoring, and hotkey checks are ready. Windows: include the
        configured model, model status, microphone status, and hotkey.
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: |
        In the Presspeech menu, choose **Copy Diagnostics**, then paste the
        result here. It excludes transcript, audio, and dictionary contents.

        If Presspeech cannot open, instead include only the relevant last ~30
        lines from `~/Library/Logs/Presspeech.log` on macOS or
        `%APPDATA%\Presspeech\log.txt` on Windows. Review logs before posting.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Add screenshots or other non-sensitive context if useful.
