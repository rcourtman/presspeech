name: pages

# Deploy current main only after its latest `check` push run succeeds.
# Successful Windows publication also refreshes downloads: releases created
# with GITHUB_TOKEN do not emit a new release-triggered workflow run.
# A published-release check can retry after downloads become available, but
# must never roll Pages back to the older release's source commit.

on:
  workflow_run:
    workflows: [check, windows-release]
    types: [completed]
    # Release-triggered checks may identify their head branch by tag name.
    # The job gate rejects other events; release ancestry is verified below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.name == 'check' &&
         ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
          github.event.workflow_run.event == 'release')) ||
        (github.event.workflow_run.name == 'windows-release' &&
         github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_branch == 'main')))
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve main for every admitted event, including an older release.
          # The final boundary verifies this exact SHA has green main push CI
          # and is still main before deploying its validated artifact.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Main moves often. A green check for a commit main has already moved
      # past has nothing current to deploy; that newer commit's own check
      # triggers Pages when it passes. End without deploying, not as a failure.
      - name: Skip checks superseded by newer main
        id: current
        env:
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_NAME" == check && "$TRIGGER_EVENT" == push &&
                "$TRIGGER_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "Main advanced past ${TRIGGER_SHA:0:12}; its newer check run deploys Pages." |
              tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify published release belongs to main
        if: github.event.workflow_run.event == 'release' || github.event.workflow_run.name == 'windows-release'
        env:
          CHECKED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$CHECKED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CHECKED_RELEASE_SHA" HEAD
      - name: Docs freshness
        if: steps.current.outputs.deploy == 'true'
        run: python3 scripts/sync-docs.py --check
      # workflow_dispatch does not pass through the upstream check workflow.
      # Keep the cheap site validators at the deployment boundary as well.
      - name: Public site integrity
        if: steps.current.outputs.deploy == 'true'
        run: |
          python3 scripts/check-docs-links.py --self-test
          python3 scripts/check-docs-links.py
          python3 scripts/check-docs-accessibility.py --self-test
          python3 scripts/check-docs-accessibility.py
          python3 scripts/check-docs-metadata.py --self-test
          python3 scripts/check-docs-metadata.py
          python3 scripts/check-public-assets.py
      - name: Public release contract
        if: steps.current.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-public-releases.py --require-published
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.current.outputs.deploy == 'true'
        with:
          path: docs
      - name: Require green current main before deployment
        id: gate
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # One bounded response; the validator rejects truncated pagination.
          timeout 30s gh api \
            "repos/rcourtman/presspeech/actions/workflows/check.yml/runs?branch=main&event=push&head_sha=$sha&per_page=100" \
            > "$RUNNER_TEMP/pages-check-runs.json"
          python3 scripts/check-pages-deployment.py \
            --expected-sha "$sha" --runs-json "$RUNNER_TEMP/pages-check-runs.json"
          # Catch a main update while validators or artifact upload were running.
          # The public remote needs no persisted checkout credentials.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$sha" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            if [[ "$TRIGGER_NAME" == check && "$TRIGGER_EVENT" == push ]]; then
              echo "Main advanced during validation; its newer check run deploys Pages." |
                tee -a "$GITHUB_STEP_SUMMARY"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Pages deployment refused: main advanced after checkout" >&2
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
