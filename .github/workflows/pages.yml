name: pages

# Deploys docs/ to GitHub Pages only after the `check` workflow has
# succeeded for the same main or published-release commit (workflow_run gate). The
# manual workflow_dispatch path stays available and deploys the
# current tip of the default branch.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    # Release-triggered checks may identify their head branch by tag name.
    # The job gate rejects other events; release ancestry is verified below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
        github.event.workflow_run.event == 'release'))
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only trusted main pushes or published-release checks reach this job.
          # Keep the successful check's exact commit. Manual dispatch always
          # checks out main, even when another dispatch ref was selected.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release belongs to main
        if: github.event.workflow_run.event == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Docs freshness
        run: python3 scripts/sync-docs.py --check
      # workflow_dispatch does not pass through the upstream check workflow.
      # Keep the cheap site validators at the deployment boundary as well.
      - name: Public site integrity
        run: |
          python3 scripts/check-docs-links.py --self-test
          python3 scripts/check-docs-links.py
          python3 scripts/check-docs-accessibility.py --self-test
          python3 scripts/check-docs-accessibility.py
          python3 scripts/check-docs-metadata.py --self-test
          python3 scripts/check-docs-metadata.py
      - name: Public release contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-public-releases.py --require-published
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
