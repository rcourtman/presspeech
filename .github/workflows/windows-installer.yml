name: windows installer

on:
  workflow_dispatch:
    inputs:
      full_package:
        description: "Build the full app and qualify upgrades from pinned published installers"
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  attestations: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Install the locked release environment
        working-directory: windows
        shell: pwsh
        run: |
          # Install only reviewed wheel hashes, including the separate CUDA
          # runtime. Disable all pip configuration files, including global/site
          # files that --isolated alone would still read.
          $env:PIP_CONFIG_FILE = 'NUL'
          # The hosted image's global Python carries its own tools (pipx and its
          # dependencies), which `pip check` would judge against versions outside
          # this lock. Install into a fresh venv so the checks cover exactly the
          # release runtime, and put it first on PATH for the later steps.
          $venv = Join-Path $env:RUNNER_TEMP 'presspeech-release-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Release virtual environment creation failed' }
          $venvScripts = Join-Path $venv 'Scripts'
          $env:PATH = "$venvScripts;$env:PATH"
          $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -c "import sys; raise SystemExit(sys.prefix == sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { throw 'Release Python is not the isolated virtual environment' }
          python -m pip install --isolated --no-cache-dir --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked PyPI installation failed' }
          python -m pip install --isolated --no-cache-dir --no-deps --only-binary=:all: --require-hashes -r requirements-cuda-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CUDA installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Release dependency graph is inconsistent' }
          python release_requirements.py --verify-environment
          if ($LASTEXITCODE -ne 0) { throw 'Release runtime does not match its pins' }
          winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --force --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Unit tests
        working-directory: windows
        env:
          PRESSPEECH_NATIVE_CLIPBOARD_TEST: "1"
          PRESSPEECH_NATIVE_SESSION_TEST: "1"
        run: python -m unittest discover -s tests -v
      - name: Qualify installer transactions
        working-directory: windows
        timeout-minutes: 30
        run: |
          . .\find-inno-compiler.ps1
          $compiler = Find-PresspeechInnoCompiler
          python qualify-upgrades.py --compiler $compiler --output (Join-Path $env:RUNNER_TEMP 'upgrade-qualification')
          if ($LASTEXITCODE -ne 0) { throw 'Installer transaction qualification failed' }
      - name: Build full candidate
        if: inputs.full_package
        working-directory: windows
        timeout-minutes: 35
        run: |
          # Keep the package staging and installer extraction on the disposable
          # runner's temporary volume. No model is downloaded or microphone opened.
          $packageTemp = Join-Path $env:RUNNER_TEMP 'package-temp'
          New-Item -ItemType Directory -Path $packageTemp -Force | Out-Null
          $env:TEMP = $packageTemp
          $env:TMP = $packageTemp
          "TEMP=$packageTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$packageTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = python -c "import config; print(config.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read app version' }
          .\build-release.ps1 -Version $version -Python (Get-Command python).Source
      - name: Qualify full installed upgrades
        if: inputs.full_package
        working-directory: windows
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import config; print(config.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read app version' }
          .\qualify-full-upgrade.ps1 -Installer "dist/installer/Presspeech-Setup-$version-x64.exe" -ExpectedVersion $version
      - name: Save upgrade qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-upgrade-qualification
          path: |
            ${{ runner.temp }}/upgrade-qualification/results.json
            ${{ runner.temp }}/upgrade-qualification/command-*.txt
            ${{ runner.temp }}/upgrade-qualification/**/*.log
            ${{ runner.temp }}/upgrade-qualification/**/*.iss
            ${{ runner.temp }}/upgrade-qualification/*.diskpart.txt
            ${{ runner.temp }}/presspeech-full-upgrade-*/**/*.log
            ${{ runner.temp }}/presspeech-full-upgrade-*/**/results.json
            ${{ runner.temp }}/presspeech-full-upgrade-*/**/release.json
            ${{ runner.temp }}/presspeech-full-upgrade-*/**/*-package.txt
            ${{ runner.temp }}/presspeech-installer-smoke-*/*.log
            ${{ runner.temp }}/presspeech-installer-smoke-*/*.json
          retention-days: 14
