name: check

# Lightweight macOS repo-hygiene checks plus pure DEBUG self-tests.
# The Swift self-test lane is pure DEBUG logic; the full build/notarise path
# still lives in ship-swift.sh on a trusted release environment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift self-tests
        working-directory: swift
        run: swift run -c debug Presspeech --self-test all
      - name: Swift release build
        working-directory: swift
        run: swift build -c release
      - name: Swift bench build (rot detection)
        # Debug-config compile of the standalone benchmark package so its
        # sources can't silently rot against toolchain/FluidAudio changes.
        # It is never shipped, so a debug build is enough.
        run: |
          swift build --package-path experiments/swift-bench
          experiments/swift-bench/.build/debug/presspeech-bench --self-test
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' path; do
            bash -n "${path}"
          done < <(git grep -Ilz -E '^#!.*bash')
      - name: Packaged app smoke test
        run: scripts/smoke-packaged-app.sh
      - name: Release script self-test
        run: ./ship-swift.sh --self-test
      - name: Benchmark helper self-tests
        env:
          # Exercise the locale boundary: report metrics must remain dot-decimal.
          LC_ALL: pl_PL.UTF-8
        run: |
          experiments/swift-bench/bench-power.sh --self-test
          experiments/swift-bench/add-real-dictation-fixture.sh --self-test
          experiments/swift-bench/fetch-public-speech-fixtures.sh --self-test
          experiments/swift-bench/run-real-dictation-regression.sh --self-test
          experiments/swift-bench/run-real-model-comparison.sh --self-test
          experiments/swift-bench/run-vocabulary-bias-regression.sh --self-test
          experiments/swift-bench/run-public-model-comparison.sh --self-test
          experiments/swift-bench/run-release-asr-checks.sh --self-test
          experiments/swift-bench/run-tail-word-regression.sh --self-test
      - name: Model manifest updater self-test
        run: python3 scripts/update-model-manifest.py --self-test
      - name: Docs sync self-test
        run: python3 scripts/sync-docs.py --self-test
      - name: Log privacy guard
        run: |
          python3 scripts/check-log-privacy.py --self-test
          python3 scripts/check-log-privacy.py
      - name: Plist + XML syntax
        run: |
          plutil -lint \
            swift/Info.plist \
            entitlements.plist
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in [
              "swift/Info.plist",
              "entitlements.plist",
              "docs/sitemap.xml",
              "docs/favicon.svg",
              *sorted(glob.glob("icon/*.svg")),
          ]:
              ET.parse(path)
          PY
      - name: YAML syntax
        run: |
          git ls-files -z -- '*.yml' '*.yaml' | ruby -e '
          require "yaml"

          STDIN.read.split("\0").reject(&:empty?).each do |path|
            YAML.load_file(path)
          end
          '
      - name: Workflow script input safety
        run: |
          ruby - <<'RUBY'
          require "yaml"

          unsafe = []
          unscoped_winget = []
          unpinned_winget = []
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            jobs = YAML.load_file(path).fetch("jobs", {})
            jobs.each_value do |job|
              Array(job["steps"]).each do |step|
                run = step["run"]
                if run&.match?(/\$\{\{\s*inputs\./)
                  unsafe << "#{path}: #{step.fetch("name", "unnamed step")}"
                end

                if run&.match?(/\bwinget\s+install\b/) && !run.match?(/--source\s+winget\b/)
                  unscoped_winget << "#{path}: #{step.fetch("name", "unnamed step")}"
                end
                if run&.match?(/\bwinget\s+install\b/) &&
                    !run.match?(/--version\s+[0-9]+(?:\.[0-9]+)+\b/)
                  unpinned_winget << "#{path}: #{step.fetch("name", "unnamed step")}"
                end
              end
            end
          end
          abort "workflow inputs must enter scripts through env:\n#{unsafe.join("\n")}" unless unsafe.empty?
          abort "winget installs must pin the community source:\n#{unscoped_winget.join("\n")}" unless unscoped_winget.empty?
          abort "winget installs must pin an exact version:\n#{unpinned_winget.join("\n")}" unless unpinned_winget.empty?
          RUBY
      - name: Release publication safety
        run: |
          ruby - <<'RUBY'
          require "yaml"

          ci_workflow = YAML.load_file(".github/workflows/windows.yml")
          # YAML 1.1 parsers treat the unquoted `on` key as boolean true.
          triggers = ci_workflow["on"] || ci_workflow[true]
          push = triggers.is_a?(Hash) ? triggers["push"] : nil
          unless push.is_a?(Hash) && Array(push["branches"]).include?("main") &&
              !push.key?("paths") && !push.key?("paths-ignore")
            abort "Windows CI must run on every main push required by release approval"
          end

          workflow = File.read(".github/workflows/windows-release.yml")
          atomic_create = %r{
            gh\s+release\s+create\s+\$tag\s+`\s*
            \$installer\s+`\s*
            "\$installer\.sha256"\s+`
          }x

          unless workflow.match?(atomic_create)
            abort "Windows releases must attach both assets during release creation"
          end
          create_recovery = %r{
            gh\s+release\s+create\s+\$tag.*?
            \$createExitCode\s*=\s*\$LASTEXITCODE.*?
            if\s*\(\$createExitCode\s+-ne\s+0\).*?
            gh\s+api\s+`
          }mx
          unless workflow.match?(create_recovery)
            abort "Failed atomic creates must recover before discarding build outputs"
          end
          unless workflow.match?(/gh\s+release\s+upload\s+\$tag/) &&
              workflow.include?("validate-release-state.ps1")
            abort "Interrupted Windows drafts must use guarded recovery"
          end
          guarded_draft_publish = %r{
            if\s*\(\$disposition\s+-ceq\s+"publish-draft"\)\s*\{.*?
            \.\\windows\\validate-release-tag\.ps1\s+`\s*
            -Tag\s+\$tag\s+`\s*
            -ExpectedSha\s+\$env:PRESSPEECH_RELEASE_EXPECTED_SHA\s*
            gh\s+release\s+edit\s+\$tag\s+--draft=false\s+--prerelease
          }mx
          unless workflow.match?(guarded_draft_publish)
            abort "Resumed Windows drafts must revalidate the tag immediately before publication"
          end
          if workflow.match?(/\bgh\s+release\s+upload[^\n]*--clobber/) ||
              workflow.match?(/\bgh\s+release\s+delete\b/)
            abort "Windows draft recovery must not replace releases or assets"
          end
          RUBY
      - name: Windows CUDA dependency consistency
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          cuda_requirements = Path("windows/requirements-cuda.txt").read_text(
              encoding="utf-8")
          torch_pins = re.findall(
              r"(?m)^torch==\d+\.\d+\.\d+\+cu(\d+)$", cuda_requirements)
          index_pins = re.findall(
              r"(?m)^--index-url https://download\.pytorch\.org/whl/cu(\d+)$",
              cuda_requirements)
          if len(torch_pins) != 1:
              raise SystemExit("requirements-cuda.txt must pin one exact CUDA Torch build")
          if index_pins != torch_pins:
              raise SystemExit("CUDA Torch build and package index versions must match")

          install_paths = [
              Path("README.md"),
              Path("CONTRIBUTING.md"),
              Path("windows/README.md"),
              Path(".github/workflows/windows-release.yml"),
          ]
          direct_installs = []
          for path in install_paths:
              text = path.read_text(encoding="utf-8")
              if "-r requirements-cuda.txt" not in text:
                  raise SystemExit(f"{path} does not install requirements-cuda.txt")
              if re.search(r"(?im)^.*\bpip\s+install\b[^\n]*\btorch(?:==|\s|$)", text):
                  direct_installs.append(str(path))
          if direct_installs:
              raise SystemExit(
                  "CUDA Torch installs must use requirements-cuda.txt: " +
                  ", ".join(direct_installs))
          PY
      - name: Docs syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              Path("scripts/sync-docs.py"),
              Path("scripts/update-model-manifest.py"),
              Path("scripts/check-log-privacy.py"),
          ]:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          python3 -m json.tool docs/benchmarks/results.json >/dev/null
          python3 -m json.tool docs/privacy/network-calls.json >/dev/null
          python3 -m json.tool docs/site-metadata.json >/dev/null
          python3 -m json.tool marketing/demo/package.json >/dev/null
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for path in sorted(Path("docs").rglob("*.html")):
              text = path.read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              if "<title>" not in text or "</main>" not in text:
                  raise SystemExit(f"{path}: missing title or main")
          PY
      - name: Docs freshness
        run: python3 scripts/sync-docs.py --check
