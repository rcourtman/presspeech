name: comparison freshness

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check comparison review age
        run: python3 scripts/sync-docs.py --check
      - name: Check pinned comparison releases
        run: python3 scripts/check-compare-releases.py
