name: windows-release
run-name: Windows release ${{ inputs.version }} (${{ inputs.request_id || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows version (X.Y.Z)"
        required: true
        type: string
      request_id:
        description: "Guarded-client correlation ID (normally blank)"
        required: false
        type: string
      expected_sha:
        description: "Exact main commit approved for release (40-character SHA)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Signing timestamps make repeated builds non-identical. Never let two jobs
  # race to replace the same version's release assets.
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Treat workflow_dispatch input as data. Referencing it directly inside a
      # PowerShell run block would allow PowerShell expressions in the input.
      PRESSPEECH_RELEASE_VERSION: ${{ inputs.version }}
      PRESSPEECH_RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      PRESSPEECH_RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      PRESSPEECH_RELEASE_HEAD_SHA: ${{ github.sha }}
      PRESSPEECH_RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = $env:PRESSPEECH_RELEASE_VERSION
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Version must have the canonical form X.Y.Z"
          }
          $requestId = $env:PRESSPEECH_RELEASE_REQUEST_ID
          if ($requestId -and $requestId -notmatch '^[0-9]{8}T[0-9]{6}Z-[0-9]+$') {
            throw "Request ID must be blank or use the guarded-client format"
          }
          .\windows\validate-release-context.ps1 `
            -DispatchRef $env:PRESSPEECH_RELEASE_REF `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -HeadSha $env:PRESSPEECH_RELEASE_HEAD_SHA
          $expected = 'VERSION = "' + $version + '"'
          $declared = @(Get-Content -LiteralPath windows/config.py |
            Where-Object { $_ -match '^VERSION\s*=' })
          if ($declared.Count -ne 1 -or $declared[0] -ne $expected) {
            throw "windows/config.py must declare $expected"
          }
          $notes = "windows/release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
      - name: Validate existing release tag
        shell: pwsh
        run: |
          .\windows\validate-release-tag.ps1 `
            -Tag "windows-v$env:PRESSPEECH_RELEASE_VERSION" `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -AllowMissing
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime and build dependencies
        working-directory: windows
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir -r requirements.txt -r requirements-build.txt
          python -m pip install --no-cache-dir -r requirements-cuda.txt
          winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --force --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Import optional signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP "presspeech-signing.pfx"
            [IO.File]::WriteAllBytes(
              $path,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "PRESSPEECH_CERT_PATH=$path" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build installer
        working-directory: windows
        shell: pwsh
        env:
          PRESSPEECH_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          .\build-release.ps1 `
            -Version $env:PRESSPEECH_RELEASE_VERSION `
            -Python (Get-Command python).Source
      - name: Remove signing certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:PRESSPEECH_CERT_PATH) {
            Remove-Item -LiteralPath $env:PRESSPEECH_CERT_PATH -Force `
              -ErrorAction SilentlyContinue
          }
      - name: Publish Windows prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:PRESSPEECH_RELEASE_VERSION
          $tag = "windows-v$version"
          $notes = "windows/release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          # The build is intentionally long. Recheck immediately before any
          # public release mutation so a conflicting tag cannot sit unnoticed
          # between the pre-build validation and release creation.
          .\windows\validate-release-tag.ps1 `
            -Tag $tag `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -AllowMissing
          $releaseJson = gh release view $tag `
            --json isDraft,isPrerelease,tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
              --prerelease `
              --title "Presspeech for Windows $version" `
              --notes-file $notes
          } else {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tagName -ne $tag -or $release.isDraft -or
                -not $release.isPrerelease) {
              throw "Existing $tag release is not the expected published prerelease"
            }
          }
          # targetCommitish can retain stale creation metadata after a tag is
          # moved. Verify the actual tag ref before replacing any assets.
          .\windows\validate-release-tag.ps1 `
            -Tag $tag `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA
          $installer = "windows/dist/installer/Presspeech-Setup-$version-x64.exe"
          gh release upload $tag $installer "$installer.sha256" --clobber
