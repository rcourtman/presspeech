name: windows-release
run-name: Windows release ${{ inputs.version }} (${{ inputs.request_id || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows version (X.Y.Z)"
        required: true
        type: string
      request_id:
        description: "Guarded-client correlation ID (normally blank)"
        required: false
        type: string
      expected_sha:
        description: "Exact main commit approved for release (40-character SHA)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  # Signing timestamps make repeated builds non-identical. Never let two jobs
  # race to publish the same version.
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Treat workflow_dispatch input as data. Referencing it directly inside a
      # PowerShell run block would allow PowerShell expressions in the input.
      PRESSPEECH_RELEASE_VERSION: ${{ inputs.version }}
      PRESSPEECH_RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      PRESSPEECH_RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      PRESSPEECH_RELEASE_HEAD_SHA: ${{ github.sha }}
      PRESSPEECH_RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = $env:PRESSPEECH_RELEASE_VERSION
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Version must have the canonical form X.Y.Z"
          }
          $requestId = $env:PRESSPEECH_RELEASE_REQUEST_ID
          if ($requestId -and $requestId -notmatch '^[0-9]{8}T[0-9]{6}Z-[0-9]+$') {
            throw "Request ID must be blank or use the guarded-client format"
          }
          .\windows\validate-release-context.ps1 `
            -DispatchRef $env:PRESSPEECH_RELEASE_REF `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -HeadSha $env:PRESSPEECH_RELEASE_HEAD_SHA
          $expected = 'VERSION = "' + $version + '"'
          $declared = @(Get-Content -LiteralPath windows/config.py |
            Where-Object { $_ -match '^VERSION\s*=' })
          if ($declared.Count -ne 1 -or $declared[0] -ne $expected) {
            throw "windows/config.py must declare $expected"
          }
          $notes = "windows/release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
      - name: Validate existing release tag
        shell: pwsh
        run: |
          .\windows\validate-release-tag.ps1 `
            -Tag "windows-v$env:PRESSPEECH_RELEASE_VERSION" `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -AllowMissing
      - name: Require green CI for approved commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = $env:PRESSPEECH_RELEASE_EXPECTED_SHA
          $checkJson = gh api `
            "repos/rcourtman/presspeech/actions/workflows/check.yml/runs?branch=main&event=push&head_sha=$sha&per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read repository CI runs for approved commit $sha"
          }
          $windowsJson = gh api `
            "repos/rcourtman/presspeech/actions/workflows/windows.yml/runs?branch=main&event=push&head_sha=$sha&per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read Windows CI runs for approved commit $sha"
          }
          .\windows\validate-release-checks.ps1 `
            -CheckWorkflowJson $checkJson `
            -WindowsWorkflowJson $windowsJson `
            -ExpectedSha $sha
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime and build dependencies
        working-directory: windows
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir -r requirements.txt -r requirements-build.txt
          python -m pip install --no-cache-dir -r requirements-cuda.txt
          winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --force --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Import optional signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP "presspeech-signing.pfx"
            [IO.File]::WriteAllBytes(
              $path,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "PRESSPEECH_CERT_PATH=$path" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build installer
        working-directory: windows
        shell: pwsh
        env:
          PRESSPEECH_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          .\build-release.ps1 `
            -Version $env:PRESSPEECH_RELEASE_VERSION `
            -Python (Get-Command python).Source
      - name: Remove signing certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:PRESSPEECH_CERT_PATH) {
            Remove-Item -LiteralPath $env:PRESSPEECH_CERT_PATH -Force `
              -ErrorAction SilentlyContinue
          }
      - name: Publish Windows prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:PRESSPEECH_RELEASE_VERSION
          $tag = "windows-v$version"
          $notes = "windows/release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          # The build is intentionally long. Recheck immediately before any
          # public release mutation so a conflicting tag cannot sit unnoticed
          # between the pre-build validation and release creation.
          .\windows\validate-release-tag.ps1 `
            -Tag $tag `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -AllowMissing
          $installer = "windows/dist/installer/Presspeech-Setup-$version-x64.exe"
          $releaseJson = gh api `
            "repos/rcourtman/presspeech/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $releaseJson = ""
          }
          $disposition = .\windows\validate-release-state.ps1 `
            -ReleaseJson $releaseJson `
            -Tag $tag `
            -Version $version `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -Installer $installer `
            -Checksum "$installer.sha256" `
            -Notes $notes
          if ($disposition -ceq "create") {
            # Supplying both assets to `gh release create` makes the CLI stage
            # a draft, upload the complete pair, and publish only after both
            # uploads succeed. If the CLI exits after creating that draft, do
            # not discard this runner's exact (potentially timestamped) build:
            # inspect and finish the draft through the guarded recovery below.
            gh release create $tag `
              $installer `
              "$installer.sha256" `
              --target $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
              --prerelease `
              --title "Presspeech for Windows $version" `
              --notes-file $notes
            $createExitCode = $LASTEXITCODE
            if ($createExitCode -ne 0) {
              $releaseJson = gh api `
                "repos/rcourtman/presspeech/releases/tags/$tag" 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "Could not atomically publish Windows release $tag"
              }
              $disposition = .\windows\validate-release-state.ps1 `
                -ReleaseJson $releaseJson `
                -Tag $tag `
                -Version $version `
                -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
                -Installer $installer `
                -Checksum "$installer.sha256" `
                -Notes $notes
            } else {
              $disposition = "verify-published"
            }
          }
          if ($disposition -like "upload-*" -or
              $disposition -ceq "publish-draft") {
            # Resume only an exact matching private draft. Existing assets must
            # match the local build, and uploads never clobber an asset, so this
            # recovery path cannot replace anything already published.
            .\windows\validate-release-tag.ps1 `
              -Tag $tag `
              -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA
            if ($disposition -ceq "upload-both") {
              gh release upload $tag $installer "$installer.sha256"
            } elseif ($disposition -ceq "upload-installer") {
              gh release upload $tag $installer
            } elseif ($disposition -ceq "upload-checksum") {
              gh release upload $tag "$installer.sha256"
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resume interrupted draft release $tag"
            }
            $releaseJson = gh api `
              "repos/rcourtman/presspeech/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read resumed draft release $tag"
            }
            $disposition = .\windows\validate-release-state.ps1 `
              -ReleaseJson $releaseJson `
              -Tag $tag `
              -Version $version `
              -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
              -Installer $installer `
              -Checksum "$installer.sha256" `
              -Notes $notes
            if ($disposition -ceq "publish-draft") {
              gh release edit $tag --draft=false --prerelease
              if ($LASTEXITCODE -ne 0) {
                throw "Could not publish resumed draft release $tag"
              }
              $disposition = "verify-published"
            } elseif ($disposition -cne "verify-published") {
              throw "Resumed draft is incomplete: $disposition"
            }
          }
          if ($disposition -cne "verify-published") {
            throw "Unexpected Windows release disposition: $disposition"
          }
          # targetCommitish can retain stale creation metadata after a tag is
          # moved. Verify the actual tag ref before trusting any assets.
          .\windows\validate-release-tag.ps1 `
            -Tag $tag `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA
          # The updater consumes the REST API's exact names, sizes, hashes, and
          # URLs. Confirm that public metadata contract rather than treating a
          # successful CLI process as sufficient publication proof. On a rerun,
          # this also makes published assets immutable: they must match the
          # rebuilt files exactly instead of being deleted and re-uploaded.
          $publishedJson = gh api `
            "repos/rcourtman/presspeech/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the published Windows release"
          }
          $publishedDisposition = .\windows\validate-release-state.ps1 `
            -ReleaseJson $publishedJson `
            -Tag $tag `
            -Version $version `
            -ExpectedSha $env:PRESSPEECH_RELEASE_EXPECTED_SHA `
            -Installer $installer `
            -Checksum "$installer.sha256" `
            -Notes $notes
          if ($publishedDisposition -cne "verify-published") {
            throw "Windows release did not reach the published state"
          }
          .\windows\validate-release-assets.ps1 `
            -ReleaseJson $publishedJson `
            -Tag $tag `
            -Version $version `
            -Installer $installer `
            -Checksum "$installer.sha256"
