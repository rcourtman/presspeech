name: windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        working-directory: windows
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        working-directory: windows
        run: python -m compileall -q app.py benchmark.py british.py config.py engine.py ui.py updates.py
      - name: Packaging script safety and syntax
        working-directory: windows
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content build-release.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-assets.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-checks.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-context.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-tag.ps1 -Raw)) | Out-Null
          .\validate-release-assets.ps1 -SelfTest
          .\validate-release-checks.ps1 -SelfTest
          .\validate-release-context.ps1 -SelfTest
          .\validate-release-tag.ps1 -SelfTest
          $headSha = git rev-parse HEAD
          $repoRoot = (Resolve-Path "..").Path
          .\validate-release-tag.ps1 `
            -Tag "windows-v999999.999999.999999" `
            -ExpectedSha $headSha `
            -Remote $repoRoot `
            -AllowMissing
          if ($LASTEXITCODE -ne 0) {
            throw "missing allowed release tag left a failing native exit status"
          }
          python -m py_compile Presspeech.spec
          $rejected = $false
          try {
            .\build-release.ps1 `
              -Version "999.999.999" `
              -Python (Get-Command python).Source `
              -SkipInstaller
          } catch {
            if ($_.Exception.Message -notlike "*config.py must declare*") {
              throw
            }
            $rejected = $true
          }
          if (-not $rejected) {
            throw "build-release.ps1 accepted a version that disagrees with config.py"
          }
