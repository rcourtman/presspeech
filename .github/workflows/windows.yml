name: windows

on:
  # Release publication requires a green Windows push run for the exact main
  # commit being approved. Do not path-filter main pushes: otherwise an
  # unrelated docs, benchmark, or macOS change after the last Windows change
  # leaves the current release commit permanently ineligible.
  push:
    branches: [main]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Exercise the same interpreter and wheel set required by releases.
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            windows/requirements-release.txt
            windows/requirements-cuda.txt
            windows/requirements-cuda-release.txt
      - name: Install and verify the locked release environment
        working-directory: windows
        run: |
          # Isolated pip still reads global/site configuration unless disabled.
          $env:PIP_CONFIG_FILE = 'NUL'
          python -m pip install --isolated --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked PyPI installation failed' }
          python -m pip install --isolated --no-deps --only-binary=:all: --require-hashes -r requirements-cuda-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CUDA installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Release dependency graph is inconsistent' }
          python release_requirements.py --verify-environment
          if ($LASTEXITCODE -ne 0) { throw 'Release runtime does not match its pins' }
      - name: Unit tests
        working-directory: windows
        # The opted-in native probe replaces the runner clipboard only with
        # synthetic text and checks the real Win32 privacy marker. Keep this
        # opt-in scoped to the disposable GitHub-hosted job, not local or
        # self-hosted test runs.
        env:
          PRESSPEECH_NATIVE_CLIPBOARD_TEST: "1"
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        working-directory: windows
        run: python -m compileall -q app.py benchmark.py british.py config.py engine.py model_cache.py model_network.py ui.py updates.py
      - name: Packaging script safety and syntax
        working-directory: windows
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content build-release.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-assets.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-checks.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-context.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-state.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content validate-release-tag.ps1 -Raw)) | Out-Null
          .\smoke-installer.ps1 -SelfTest
          .\validate-release-assets.ps1 -SelfTest
          .\validate-release-checks.ps1 -SelfTest
          .\validate-release-context.ps1 -SelfTest
          .\validate-release-state.ps1 -SelfTest
          .\validate-release-tag.ps1 -SelfTest
          $headSha = git rev-parse HEAD
          $repoRoot = (Resolve-Path "..").Path
          .\validate-release-tag.ps1 `
            -Tag "windows-v999999.999999.999999" `
            -ExpectedSha $headSha `
            -Remote $repoRoot `
            -AllowMissing
          if ($LASTEXITCODE -ne 0) {
            throw "missing allowed release tag left a failing native exit status"
          }
          python -m py_compile Presspeech.spec
          $rejected = $false
          try {
            .\build-release.ps1 `
              -Version "999.999.999" `
              -Python (Get-Command python).Source `
              -SkipInstaller
          } catch {
            if ($_.Exception.Message -notlike "*config.py must declare*") {
              throw
            }
            $rejected = $true
          }
          if (-not $rejected) {
            throw "build-release.ps1 accepted a version that disagrees with config.py"
          }
