# Surface advisories and updates for the Swift, Windows Python, and GitHub
# Actions dependency surfaces. Updates land as PRs rather than auto-merging —
# the maintainer reviews each one before accepting a new version.
version: 2
updates:
  - package-ecosystem: swift
    directory: /swift
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /windows
    schedule:
      interval: weekly
    # Most runtime requirements are lower bounds, so avoid PRs that merely
    # raise a floor while the existing constraint already permits the update.
    versioning-strategy: increase-if-necessary
    # The CUDA files set `--index-url` to the PyTorch wheel index, which
    # Dependabot applies to every package in /windows: non-Torch lookups get
    # 403s, and +cu126 hashes cannot be fetched from PyPI. Bump CUDA Torch by
    # hand and regenerate the locks with windows/release_requirements.py.
    exclude-paths:
      - "**/requirements-cuda*.txt"
    # Dependabot edits the release lock's pins and hashes but cannot rebuild
    # its fingerprint header, so every /windows PR fails the lock check. One
    # weekly PR (plus one for advisories) lists the candidates; the maintainer
    # regenerates the lock for the accepted ones (see CONTRIBUTING).
    groups:
      windows-pip:
        applies-to: version-updates
        patterns:
          - "*"
      windows-pip-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
