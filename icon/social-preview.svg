<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system, system-ui, 'Helvetica Neue', sans-serif">
  <!-- background -->
  <rect width="1280" height="640" fill="#FAF8F2"/>

  <!-- left: the squircle logo (scaled-down version of icon/presspeech.svg) -->
  <g transform="translate(80, 80)">
    <rect width="480" height="480" rx="109" fill="#10B981"/>
    <rect x="174" y="103" width="131" height="206" rx="65" fill="#FFFFFF"/>
    <rect x="231" y="309" width="19" height="47" fill="#FFFFFF"/>
    <rect x="146" y="356" width="187" height="21" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- right: title + tagline -->
  <g transform="translate(640, 0)">
    <text x="0" y="270" font-size="98" font-weight="700" fill="#0F172A" letter-spacing="-1">Presspeech</text>
    <text x="0" y="330" font-size="32" font-weight="500" fill="#475569">Private local dictation</text>
    <text x="0" y="370" font-size="32" font-weight="500" fill="#475569">for Mac and Windows</text>

    <!-- footer chip -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" font-size="22" font-weight="500" fill="#10B981">macOS release · Windows prerelease</text>

      <!-- Hard-number stat line — the share preview's job is to make
           someone click through, and concrete numbers do that better
           than adjectives. One <text> with <tspan>s so the spacing
           flows naturally rather than being hand-positioned. -->
      <text x="0" y="42" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" xml:space="preserve"><tspan font-weight="700" fill="#0F172A">macOS: ~100 ms </tspan><tspan font-weight="400" fill="#475569">· 8.3 MB zip · ~80 MB RAM</tspan></text>

      <text x="0" y="92" font-size="20" font-weight="400" fill="#64748B" letter-spacing="0.5">Local · Private · Free · MIT</text>
    </g>
  </g>
</svg>
